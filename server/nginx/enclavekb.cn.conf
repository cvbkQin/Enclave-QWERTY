# enclavekb.cn：整句模型文件托管（A3）+ 反馈接收接口（A4）。
# setup.sh 会把它放到 /etc/nginx/sites-available/ 并由 certbot 补上证书路径。

limit_req_zone $binary_remote_addr zone=feedback:1m rate=1r/m;

# 访问日志只记 IP、时间、地址、状态、大小、UA，不记请求正文；logrotate 保留 180 天（网络安全法要求网络日志留存不少于六个月）。
log_format enclave '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name enclavekb.cn www.enclavekb.cn;

    access_log /var/log/nginx/enclavekb.access.log enclave;

    root /var/www/enclavekb;

    # 整句模型：nginx 静态文件默认支持 Range（断点续传），并带 ETag/Last-Modified，iOS 的 resumeData 要靠这两个。
    location /grammar/ {
        types { application/octet-stream gram; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
        autoindex off;
    }

    # 在线扩展词库（B6）：catalog.json 是清单，App 打开词库页时拉一次，不缓存太久；词库文件按 sha256 校验。
    location /dicts/ {
        types { application/json json; text/plain yaml; }
        charset utf-8;
        add_header Cache-Control "public, max-age=600";
        autoindex off;
    }

    location = /api/feedback {
        limit_req zone=feedback;
        limit_req_status 429;
        client_max_body_size 6m;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8081;
    }

    location = /api/feedback/health {
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        return 404;
    }
}
