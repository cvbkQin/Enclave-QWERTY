# 两个拼音方案的拼写规则。

# 全键盘。
pinyin:
  # 简拼：每个音节可以只打声母，zh ch sh 算一个声母。
  - abbrev/^([a-z]).+$/$1/
  - abbrev/^([zcs]h).+$/$1/
  # ü 打成 v 或 u 都行：lve/lue、jv/ju。
  - derive/^([nl])ve$/$1ue/
  - derive/^([jqxy])u/$1v/
  # 常见的手误：后鼻音 ng 打成 gn。
  - derive/([aeio])ng$/$1gn/
  # ong 少打一个 g 也能出字（拼音里没有 on 这个韵母，不会混）。
  - derive/ong$/on/

# 九宫格：同样的简拼和 ü 规则，再把字母换成手机键盘上的数字键。
# 每条 derive 都保留原来的写法，所以选过拼音的字母和还没选的数字可以混在一起。
nine_key:
  - abbrev/^([a-z]).+$/$1/
  - abbrev/^([zcs]h).+$/$1/
  - derive/^([nl])ve$/$1ue/
  - derive/^([jqxy])u/$1v/
  - derive/ong$/on/
  - derive/[abc]/2/
  - derive/[def]/3/
  - derive/[ghi]/4/
  - derive/[jkl]/5/
  - derive/[mno]/6/
  - derive/[pqrs]/7/
  - derive/[tuv]/8/
  - derive/[wxyz]/9/
