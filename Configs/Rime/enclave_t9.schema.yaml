# Rime schema
# encoding: utf-8
# 九宫格拼音：和全键盘共用词库，按键是数字，选过拼音的部分是字母。
schema:
  schema_id: enclave_t9
  name: Enclave 九宫格
  version: "1"

switches:
  - name: ascii_mode
    reset: 0

engine:
  processors:
    - lua_processor@*enclave_t9_state
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
    - table_translator@custom_phrase
  filters:
    - lua_filter@*enclave_t9_preedit
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba23456789
  initials: zyxwvutsrqponmlkjihgfedcba23456789
  delimiter: " '"
  # 简拼、ü 写法和全键盘一样，最后把字母换成手机键盘上的数字键。
  # 每条 derive 都保留原来的写法，所以选过拼音的字母和还没选的数字可以混在一起。
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    # 常见的手误：后鼻音 ng 打成 gn（fang 按成 fagn）。九宫格的数字串歧义多，用 fuzz 排在正确拼写之后（十年 7446426 不会变成「情感」）。
    - fuzz/([aeio])ng$/$1gn/
    - derive/ong$/on/
    - derive/[abc]/2/
    - derive/[def]/3/
    - derive/[ghi]/4/
    - derive/[jkl]/5/
    - derive/[mno]/6/
    - derive/[pqrs]/7/
    - derive/[tuv]/8/
    - derive/[wxyz]/9/

translator:
  dictionary: enclave
  prism: enclave_t9
  enable_user_dict: true
  # 把候选词的拼音放在注释里，交给 enclave_t9_preedit 换到拼写栏。
  spelling_hints: 100
  always_show_comments: true
  # 有整句模型时，按前文（分段选过的词、刚上屏的字）给后面的候选排序；没有模型时不起作用。
  contextual_suggestions: true

# 常用词：App 里加的、导入的词和系统「文本替换」，键盘每次出现时写成 enclave_phrase_t9.txt 放在用户目录，排在最前。
custom_phrase:
  dictionary: ""
  user_dict: enclave_phrase_t9
  db_class: stabledb
  enable_completion: false
  enable_sentence: false
  initial_quality: 99
