# Rime schema
# encoding: utf-8
# 全键盘拼音。
schema:
  schema_id: enclave
  name: Enclave 拼音
  version: "1"
  dependencies:
    - enclave_en

switches:
  - name: ascii_mode
    reset: 0

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
    - table_translator@english
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    # 简拼：每个音节可以只打声母，zh ch sh 算一个声母。
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    # ü 打成 v 或 u 都行：lve/lue、jv/ju。
    - derive/^([nl])ve$/$1ue/
    - derive/^([jqxy])u/$1v/
    # 常见的手误：后鼻音 ng 打成 gn。
    - derive/([aeio])ng$/$1gn/
    # ong 少打一个 g 也能出字（拼音里没有 on 这个韵母，不会混）。
    - derive/ong$/on/

translator:
  dictionary: enclave
  enable_user_dict: true
  preedit_format:
    - xform/([jqxy])v/$1u/

# 中英混输：拼音打不出词时，同样的字母也能出英文单词。
english:
  dictionary: enclave_en
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 0
