name: Enclave
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Enclave:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).enclave
        CODE_SIGN_ENTITLEMENTS: App/Enclave.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Enclave
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        EnclaveAppGroup: $(APP_GROUP_ID)
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: 语音输入需要用麦克风录下你说的话。只在你点「说话」后录音。
        NSSpeechRecognitionUsageDescription: 用苹果的语音识别把你说的话转成文字，默认只在本机离线识别。
        CFBundleURLTypes:
          - CFBundleURLName: enclave
            CFBundleURLSchemes: [enclave]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    dependencies:
      - target: EnclaveKeyboard
  EnclaveKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).enclave.keyboard
        CODE_SIGN_ENTITLEMENTS: Keyboard/EnclaveKeyboard.entitlements
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Enclave
        EnclaveAppGroup: $(APP_GROUP_ID)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
