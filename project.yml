name: Enclave
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 版本号：从 0.1 起每次改动加 0.1，正式发布时才改成 1.0。CURRENT_PROJECT_VERSION 同时加 1。
    MARKETING_VERSION: "0.89"
    CURRENT_PROJECT_VERSION: "89"
    TARGETED_DEVICE_FAMILY: "1"
targetTemplates:
  # 拼音引擎 librime 的静态库，先运行 scripts/fetch-rime.sh 下载到 Vendor/。
  Rime:
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Rime/Enclave-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/Frameworks/librime.xcframework/ios-arm64/Headers"]
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
    dependencies:
      - framework: Vendor/Frameworks/librime.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_filesystem.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_regex.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_system.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_thread.xcframework
        embed: false
      - framework: Vendor/Frameworks/libglog.xcframework
        embed: false
      - framework: Vendor/Frameworks/libleveldb.xcframework
        embed: false
      - framework: Vendor/Frameworks/libmarisa.xcframework
        embed: false
      - framework: Vendor/Frameworks/libopencc.xcframework
        embed: false
      - framework: Vendor/Frameworks/libyaml-cpp.xcframework
        embed: false
targets:
  Enclave:
    type: application
    platform: iOS
    templates: [Rime]
    sources:
      - App
      - Shared
      - path: Vendor/RimeData
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).enclave
        # 只支持 iPhone。XcodeGen 给 iOS 目标默认写 "1,2"，会盖过上面项目级的设置，所以这里再写一次。
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Enclave.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Enclave
        # 只用系统的 HTTPS，属于豁免加密，上传 TestFlight 时不再每次询问出口合规。
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en, ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        EnclaveAppGroup: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: enclave
            CFBundleURLSchemes: [enclave]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    dependencies:
      - target: EnclaveKeyboard
    # 模拟器里测购买用本地的 StoreKit 配置，不连 App Store；Archive 不受影响。
    scheme:
      storeKitConfiguration: Configs/Enclave.storekit
  EnclaveKeyboard:
    type: app-extension
    platform: iOS
    templates: [Rime]
    sources:
      - Keyboard
      - Shared
      # 不开完全访问时用的自带词库（编译好的），由 scripts/prebuild-rime.sh 生成。
      - path: Vendor/RimeBuild
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).enclave.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Keyboard/EnclaveKeyboard.entitlements
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Enclave
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en, ja]
        EnclaveAppGroup: $(APP_GROUP_ID)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
