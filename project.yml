name: Enclave
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 两个 Run Script 要读 Vendor/ 和 Local.xcconfig 传来的设置。
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # 版本号：从 0.1 起每次改动加 0.1，正式发布时才改成 1.0。CURRENT_PROJECT_VERSION 同时加 1。
    # 开发版每次装机测试记作 0.93_1、0.93_2…：系统版本号不能带下划线，仍写 0.93，构建号写 9301、9302…，
    # DEV_LABEL 写「0.93_N」显示在关于页。测好合并进 main 时 DEV_LABEL 清空、构建号改回 93。
    MARKETING_VERSION: "0.93"
    CURRENT_PROJECT_VERSION: "9305"
    DEV_LABEL: "0.93_5"
    TARGETED_DEVICE_FAMILY: "1"
targetTemplates:
  # 拼音引擎 librime 的静态库，先运行 scripts/fetch-rime.sh 下载到 Vendor/。
  Rime:
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Rime/Enclave-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/Frameworks/librime.xcframework/ios-arm64/Headers"]
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
    dependencies:
      - framework: Vendor/Frameworks/librime.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_filesystem.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_regex.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_system.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_thread.xcframework
        embed: false
      - framework: Vendor/Frameworks/libglog.xcframework
        embed: false
      - framework: Vendor/Frameworks/libleveldb.xcframework
        embed: false
      - framework: Vendor/Frameworks/libmarisa.xcframework
        embed: false
      - framework: Vendor/Frameworks/libopencc.xcframework
        embed: false
      - framework: Vendor/Frameworks/libyaml-cpp.xcframework
        embed: false
targets:
  Enclave:
    type: application
    platform: iOS
    templates: [Rime]
    sources:
      - App
      - Shared
      # 编译前由 scripts/gen-builtin-secrets.py 生成；刚 clone 时还没有，所以是 optional。
      - path: Generated/Enclave/BuiltinSecrets.swift
        optional: true
      - path: Vendor/RimeData
        type: folder
        buildPhase: resources
    # 内测包的 Key（混淆）和证书指纹，生成到 Generated/<target>/BuiltinSecrets.swift（不进 Git）；别的包生成空的。也检查内测、公测开关没同时打开。
    preBuildScripts:
      - name: Builtin secrets
        script: python3 "$SRCROOT/scripts/gen-builtin-secrets.py"
        outputFiles:
          - $(SRCROOT)/Generated/$(TARGET_NAME)/BuiltinSecrets.swift
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).enclave
        # 只支持 iPhone。XcodeGen 给 iOS 目标默认写 "1,2"，会盖过上面项目级的设置，所以这里再写一次。
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/Enclave.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EnclaveDevLabel: $(DEV_LABEL)
        CFBundleDisplayName: Enclave
        # 只用系统的 HTTPS，属于豁免加密，上传 TestFlight 时不再每次询问出口合规。
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en, ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        EnclaveAppGroup: $(APP_GROUP_ID)
        # 内测版自带的接口地址和模型（见 Shared/BuiltinAPI.swift）：只有 INTERNAL_BUILD=YES 时才有值。
        # Key 不放这里，由 scripts/gen-builtin-secrets.py 混淆后编进代码。
        EnclaveInternalBuild: $(INTERNAL_BUILD)
        EnclavePublicBuild: $(PUBLIC_BUILD)
        EnclaveBuiltinBaseURL: $(ENCLAVE_BUILTIN_BASE_URL)
        EnclaveBuiltinModel: $(ENCLAVE_BUILTIN_MODEL)
        EnclaveBuiltinAnswerBaseURL: $(ENCLAVE_BUILTIN_ANSWER_BASE_URL)
        EnclaveBuiltinAnswerModel: $(ENCLAVE_BUILTIN_ANSWER_MODEL)
        CFBundleURLTypes:
          - CFBundleURLName: enclave
            CFBundleURLSchemes: [enclave]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    dependencies:
      - target: EnclaveKeyboard
    # 模拟器里测购买用本地的 StoreKit 配置，不连 App Store；Archive 不受影响。
    scheme:
      storeKitConfiguration: Configs/Enclave.storekit
  EnclaveKeyboard:
    type: app-extension
    platform: iOS
    templates: [Rime]
    sources:
      - Keyboard
      - Shared
      # 编译前由 scripts/gen-builtin-secrets.py 生成；刚 clone 时还没有，所以是 optional。
      - path: Generated/EnclaveKeyboard/BuiltinSecrets.swift
        optional: true
      # 不开完全访问时用的自带词库（编译好的），由 scripts/prebuild-rime.sh 生成。
      - path: Vendor/RimeBuild
        type: folder
        buildPhase: resources
    # 内测包的 Key（混淆）和证书指纹，生成到 Generated/<target>/BuiltinSecrets.swift（不进 Git）；别的包生成空的。也检查内测、公测开关没同时打开。
    preBuildScripts:
      - name: Builtin secrets
        script: python3 "$SRCROOT/scripts/gen-builtin-secrets.py"
        outputFiles:
          - $(SRCROOT)/Generated/$(TARGET_NAME)/BuiltinSecrets.swift
        basedOnDependencyAnalysis: false
    # 内测包自带整句模型：从 Vendor/Grammar/ 拷进扩展包（先运行 scripts/fetch-grammar.sh）。
    postCompileScripts:
      - name: Embed grammar
        script: bash "$SRCROOT/scripts/embed-grammar.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).enclave.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Keyboard/EnclaveKeyboard.entitlements
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EnclaveDevLabel: $(DEV_LABEL)
        CFBundleDisplayName: Enclave
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en, ja]
        EnclaveAppGroup: $(APP_GROUP_ID)
        # 内测版自带的接口地址和模型（见 Shared/BuiltinAPI.swift）：只有 INTERNAL_BUILD=YES 时才有值。
        # Key 不放这里，由 scripts/gen-builtin-secrets.py 混淆后编进代码。
        EnclaveInternalBuild: $(INTERNAL_BUILD)
        EnclavePublicBuild: $(PUBLIC_BUILD)
        EnclaveBuiltinBaseURL: $(ENCLAVE_BUILTIN_BASE_URL)
        EnclaveBuiltinModel: $(ENCLAVE_BUILTIN_MODEL)
        EnclaveBuiltinAnswerBaseURL: $(ENCLAVE_BUILTIN_ANSWER_BASE_URL)
        EnclaveBuiltinAnswerModel: $(ENCLAVE_BUILTIN_ANSWER_MODEL)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
  # 单元测试（xcodebuild test -scheme EnclaveTests，模拟器能跑）：不挂 App，直接编要测的纯逻辑文件，不链拼音引擎。
  EnclaveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: Shared
        excludes: ["Rime/*.c", "Rime/*.h"]
      - path: Keyboard/FieldSpan.swift
      - path: App/Provider.swift
      - path: App/StorefrontRegion.swift
      - path: Generated/EnclaveTests/BuiltinSecrets.swift
        optional: true
    preBuildScripts:
      - name: Builtin secrets
        script: python3 "$SRCROOT/scripts/gen-builtin-secrets.py"
        outputFiles:
          - $(SRCROOT)/Generated/$(TARGET_NAME)/BuiltinSecrets.swift
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).enclave.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [EnclaveTests]
