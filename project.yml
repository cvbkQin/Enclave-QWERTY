name: Enclave
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Configs/Base.xcconfig
  Release: Configs/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 两个 Run Script 要读 Vendor/ 和 Local.xcconfig 传来的设置。
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # 版本号：从 0.1 起每次改动加 0.1，正式发布时才改成 1.0。CURRENT_PROJECT_VERSION 同时加 1。
    # 开发版每次装机测试记作 0.95_1、0.95_2…：系统版本号不能带下划线，仍写 0.95，构建号写 9501、9502…，
    # DEV_LABEL 写「0.95_N」显示在关于页。测好合并进 main 时版本号进一位（0.95_N 合并叫 0.96，构建号 96），DEV_LABEL 清空；
    # 下一轮开发版是 0.96_1、0.96_2…。版本号、构建号统一由版本管理（04）分配和修改，功能线程不自己改。
    MARKETING_VERSION: "0.97"
    CURRENT_PROJECT_VERSION: "9720"
    DEV_LABEL: "0.97_20"
    # 开发者版装机（04 装到自己手机上）时命令行加 DEV_BUILD=YES：App 设置里出现「AI 购买状态（测试）」，默认已解锁。
    # TestFlight、公测、正式包都不加；gen-builtin-secrets.py 检查它不和 INTERNAL_BUILD、PUBLIC_BUILD 一起打开。
    DEV_BUILD: "NO"
    # iPhone 和 iPad（iPad 适配，11-22，按 0.97_6 适配一版）。
    TARGETED_DEVICE_FAMILY: "1,2"
targetTemplates:
  # 拼音引擎 librime 的静态库，先运行 scripts/fetch-rime.sh 下载到 Vendor/。
  Rime:
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Rime/Enclave-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Vendor/Frameworks/librime.xcframework/ios-arm64/Headers"]
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]
    dependencies:
      - framework: Vendor/Frameworks/librime.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_filesystem.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_regex.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_system.xcframework
        embed: false
      - framework: Vendor/Frameworks/boost_thread.xcframework
        embed: false
      - framework: Vendor/Frameworks/libglog.xcframework
        embed: false
      - framework: Vendor/Frameworks/libleveldb.xcframework
        embed: false
      - framework: Vendor/Frameworks/libmarisa.xcframework
        embed: false
      - framework: Vendor/Frameworks/libopencc.xcframework
        embed: false
      - framework: Vendor/Frameworks/libyaml-cpp.xcframework
        embed: false
targets:
  Enclave:
    type: application
    platform: iOS
    templates: [Rime]
    sources:
      - App
      - Shared
      # 编译前由 scripts/gen-builtin-secrets.py 生成；刚 clone 时还没有，所以是 optional。
      - path: Generated/Enclave/BuiltinSecrets.swift
        optional: true
      - path: Vendor/RimeData
        type: folder
        buildPhase: resources
      # 内置扩展词库（B6）：scripts/build-ext-dicts.py 生成，部署时接进拼音词库。
      - path: Configs/ExtDicts
        type: folder
        buildPhase: resources
    # 内测包的 Key（混淆）和证书指纹，生成到 Generated/<target>/BuiltinSecrets.swift（不进 Git）；别的包生成空的。也检查内测、公测开关没同时打开。
    preBuildScripts:
      - name: Builtin secrets
        script: python3 "$SRCROOT/scripts/gen-builtin-secrets.py"
        outputFiles:
          - $(SRCROOT)/Generated/$(TARGET_NAME)/BuiltinSecrets.swift
        basedOnDependencyAnalysis: false
    # 后台模式：词库自动更新每个包都有，iCloud 同步的 ICLOUD_SYNC=YES 时才写进编好的 Info.plist。输入写 Info.plist，Xcode 就会等它处理完再跑，签名在最后。
    postBuildScripts:
      - name: iCloud background modes
        script: python3 "$SRCROOT/scripts/icloud-background-modes.py"
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).enclave
        # iPhone 和 iPad（11-22 起）。XcodeGen 给 iOS 目标默认写的值会盖过上面项目级的设置，所以这里再写一次。
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 默认不带 iCloud（CloudKit）和推送；要测、要发 iCloud 同步时 ICLOUD_SYNC = YES 换成带的（见 Configs/Base.xcconfig）。
        CODE_SIGN_ENTITLEMENTS: $(APP_ENTITLEMENTS)
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EnclaveDevLabel: $(DEV_LABEL)
        CFBundleDisplayName: Enclave
        # 只用系统的 HTTPS，属于豁免加密，上传 TestFlight 时不再每次询问出口合规。
        ITSAppUsesNonExemptEncryption: false
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en, ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad 上横竖四个方向都支持：分屏、台前调度要求这样（PA4）。iPhone 照旧只竖屏。
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        EnclaveAppGroup: $(APP_GROUP_ID)
        # 内测版自带的接口地址和模型（见 Shared/BuiltinAPI.swift）：只有 INTERNAL_BUILD=YES 时才有值。
        # Key 不放这里，由 scripts/gen-builtin-secrets.py 混淆后编进代码。
        EnclaveInternalBuild: $(INTERNAL_BUILD)
        EnclavePublicBuild: $(PUBLIC_BUILD)
        EnclaveDevBuild: $(DEV_BUILD)
        EnclaveBuiltinBaseURL: $(ENCLAVE_BUILTIN_BASE_URL)
        EnclaveBuiltinModel: $(ENCLAVE_BUILTIN_MODEL)
        EnclaveBuiltinAnswerBaseURL: $(ENCLAVE_BUILTIN_ANSWER_BASE_URL)
        EnclaveBuiltinAnswerModel: $(ENCLAVE_BUILTIN_ANSWER_MODEL)
        # iCloud 同步（App/Sync）：这个包有没有 iCloud 能力、用哪个 CloudKit 容器。没有能力时代码不碰 CKContainer。
        EnclaveICloudSync: $(ICLOUD_SYNC)
        EnclaveCloudContainer: iCloud.$(BUNDLE_ID_PREFIX).enclave
        # 后台模式和后台任务编号不写在这里：由 scripts/icloud-background-modes.py 加上（见上面 postBuildScripts）。
        # 后台刷新和词库自动更新的编号每个包都有；iCloud 同步的只在 ICLOUD_SYNC=YES 的包里有。
        CFBundleURLTypes:
          - CFBundleURLName: enclave
            CFBundleURLSchemes: [enclave]
        # 备份文件 .enclave（设置 › 备份与恢复）：在「文件」里点开会交给飞地输入法恢复。
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER).backup
            UTTypeDescription: Enclave Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [enclave]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Enclave Backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [$(PRODUCT_BUNDLE_IDENTIFIER).backup]
        # 就地打开：「文件」里点 .enclave 直接交给飞地（不先拷进 Inbox），读的时候用安全作用域访问。
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    dependencies:
      - target: EnclaveKeyboard
    # 模拟器里测购买用本地的 StoreKit 配置，不连 App Store；Archive 不受影响。
    scheme:
      storeKitConfiguration: Configs/Enclave.storekit
  EnclaveKeyboard:
    type: app-extension
    platform: iOS
    templates: [Rime]
    sources:
      - Keyboard
      - Shared
      # 编译前由 scripts/gen-builtin-secrets.py 生成；刚 clone 时还没有，所以是 optional。
      - path: Generated/EnclaveKeyboard/BuiltinSecrets.swift
        optional: true
      # 不开完全访问时用的自带词库（编译好的），由 scripts/prebuild-rime.sh 生成。
      - path: Vendor/RimeBuild
        type: folder
        buildPhase: resources
      # 纠错用的按键串可能性表（全键盘 qw、九宫格 t9），由 scripts/fetch-rime.sh 生成；没生成时不纠错。
      - path: Vendor/KeyLM
        type: folder
        buildPhase: resources
        optional: true
    # 内测包的 Key（混淆）和证书指纹，生成到 Generated/<target>/BuiltinSecrets.swift（不进 Git）；别的包生成空的。也检查内测、公测开关没同时打开。
    preBuildScripts:
      - name: Builtin secrets
        script: python3 "$SRCROOT/scripts/gen-builtin-secrets.py"
        outputFiles:
          - $(SRCROOT)/Generated/$(TARGET_NAME)/BuiltinSecrets.swift
        basedOnDependencyAnalysis: false
    # 内测包自带整句模型：从 Vendor/Grammar/ 拷进扩展包（先运行 scripts/fetch-grammar.sh）。
    postCompileScripts:
      - name: Embed grammar
        script: bash "$SRCROOT/scripts/embed-grammar.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).enclave.keyboard
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Keyboard/EnclaveKeyboard.entitlements
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EnclaveDevLabel: $(DEV_LABEL)
        CFBundleDisplayName: Enclave
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans, en, ja]
        EnclaveAppGroup: $(APP_GROUP_ID)
        # 内测版自带的接口地址和模型（见 Shared/BuiltinAPI.swift）：只有 INTERNAL_BUILD=YES 时才有值。
        # Key 不放这里，由 scripts/gen-builtin-secrets.py 混淆后编进代码。
        EnclaveInternalBuild: $(INTERNAL_BUILD)
        EnclavePublicBuild: $(PUBLIC_BUILD)
        EnclaveDevBuild: $(DEV_BUILD)
        EnclaveBuiltinBaseURL: $(ENCLAVE_BUILTIN_BASE_URL)
        EnclaveBuiltinModel: $(ENCLAVE_BUILTIN_MODEL)
        EnclaveBuiltinAnswerBaseURL: $(ENCLAVE_BUILTIN_ANSWER_BASE_URL)
        EnclaveBuiltinAnswerModel: $(ENCLAVE_BUILTIN_ANSWER_MODEL)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
  # 单元测试（xcodebuild test -scheme EnclaveTests，模拟器能跑）：不挂 App，直接编要测的纯逻辑文件，不链拼音引擎。
  EnclaveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: Shared
        excludes: ["Rime/*.c", "Rime/*.h"]
      - path: Keyboard/FieldSpan.swift
      - path: App/Provider.swift
      - path: App/StorefrontRegion.swift
      - path: App/Backup/BackupArchive.swift
      - path: App/Backup/BackupCrypto.swift
      - path: App/Backup/BackupMerge.swift
      - path: App/Sync/SyncMerge.swift
      - path: App/Sync/ICloudSyncState.swift
      - path: App/Legal/PolicyFilter.swift
      - path: Generated/EnclaveTests/BuiltinSecrets.swift
        optional: true
    preBuildScripts:
      - name: Builtin secrets
        script: python3 "$SRCROOT/scripts/gen-builtin-secrets.py"
        outputFiles:
          - $(SRCROOT)/Generated/$(TARGET_NAME)/BuiltinSecrets.swift
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).enclave.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [EnclaveTests]
