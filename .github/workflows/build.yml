name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check privacy policy pages match the App
        run: python3 scripts/gen-privacy.py --check
      - name: Select newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -n 1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache Rime engine and dictionary
        uses: actions/cache@v4
        with:
          path: Vendor
          key: vendor-${{ hashFiles('scripts/fetch-rime.sh', 'scripts/build-dict.py', 'Configs/Rime/**') }}
      - name: Fetch Rime engine and dictionary
        run: bash scripts/fetch-rime.sh
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project Enclave.xcodeproj \
            -target Enclave \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || status=$?
          tail -n 200 build.log
          # 失败时把编译错误单独列出来（最后 200 行里常常看不到）。
          if [ "${status:-0}" -ne 0 ]; then
            echo "::group::Compiler errors"
            grep -n -B3 -A8 "error:" build.log | head -n 400 || true
            echo "::endgroup::"
          fi
          exit "${status:-0}"
